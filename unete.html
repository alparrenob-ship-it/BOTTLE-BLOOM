<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BottleBloom | Unete al cambio</title>
  <meta name="theme-color" content="#050505" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/bottlebloom-app.css" />
  <link rel="stylesheet" href="css/auth-entry.css" />
</head>
<body>
  <main class="auth-entry-page">
    <section class="auth-entry-card" aria-label="Acceso BottleBloom">
      <img class="auth-entry-logo" src="assets/LOGOTIPO%20FONDO%20NEGRO.png" alt="BottleBloom" />
      <h1>Bottle <span>Bloom</span></h1>
      <p>Transformamos botellas en <strong>vida.</strong></p>
      <div class="auth-entry-actions">
        <a class="btn primary full" href="home.html">Iniciar sesion</a>
        <a class="btn ghost full" href="#crear-cuenta">Crear cuenta</a>
      </div>
      <p class="auth-entry-copy">Tecnologia <strong>inteligente</strong><br>para un futuro <span>sostenible.</span></p>
    </section>

    <section class="register-panel" id="crear-cuenta">
      <form class="auth-card" id="registerForm" novalidate>
        <div class="logo-lockup" style="justify-content:center"><img src="assets/LOGOTIPO%20FONDO%20NEGRO.png" alt="BottleBloom" /></div>
        <img class="profile-photo" src="assets/MASCOTA%20PLANTA.png" alt="Foto de perfil Eco Guerrero" />
        <h2>Crear perfil Eco Guerrero</h2>
        <p>Completa tus datos para entrar al dashboard BottleBloom.</p>
        <div class="form-grid">
          <div class="field"><label>Nombre completo</label><input name="fullName" autocomplete="name" required /><small></small></div>
          <div class="field"><label>Correo electronico</label><input name="email" type="email" autocomplete="email" required /><small></small></div>
          <div class="field"><label>Edad</label><input name="age" type="number" min="6" max="100" required /><small></small></div>
          <div class="field"><label>Institucion</label><input name="institution" required /><small></small></div>
          <button class="btn primary full hidden" id="nextBtn" type="submit">Siguiente</button>
        </div>
      </form>
    </section>
  </main>
  <script type="module" src="js/bottlebloom-app.js"></script>
</body>
</html>
