<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BottleBloom | Unete al cambio</title>
  <meta name="theme-color" content="#050505" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/bottlebloom-app.css" />
  <link rel="stylesheet" href="css/auth-entry.css" />
</head>
<body>
  <main class="auth-entry-page">
    <section class="auth-shell" aria-label="Acceso BottleBloom">
      <div class="auth-choice" id="authChoice">
        <img class="auth-logo" src="assets/LOGOTIPO%20FONDO%20NEGRO.png" alt="BottleBloom" />
        <h1>Bottle<span>Bloom</span></h1>
        <p class="auth-tagline">Transformamos botellas en vida</p>

        <div class="auth-actions">
          <button class="auth-action primary" type="button" data-open-auth="login">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Iniciar sesión</span>
          </button>
          <button class="auth-action ghost" type="button" data-open-auth="register">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21a6 6 0 0 0-12 0"/><circle cx="10" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>
            <span>Registro</span>
          </button>
        </div>

        <p class="auth-entry-copy">Tecnologia <strong>inteligente</strong><br>para un futuro <span>sostenible.</span></p>
      </div>

      <section class="auth-panel hidden" id="loginPanel" aria-label="Iniciar sesion BottleBloom">
        <button class="auth-back" type="button" data-auth-back>‹ Volver</button>
        <img class="panel-logo" src="assets/LOGOTIPO%20FONDO%20NEGRO.png" alt="BottleBloom" />
        <h2>Iniciar sesión</h2>
        <p>Entra a tu perfil Eco Guerrero.</p>
        <form class="auth-card compact" id="loginForm" novalidate>
          <div class="field"><label>Correo electrónico</label><input name="email" type="email" autocomplete="email" required /><small></small></div>
          <div class="field"><label>Contraseña</label><input name="password" type="password" autocomplete="current-password" required minlength="6" /><small></small></div>
          <button class="auth-action primary form-submit" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Entrar</span>
          </button>
        </form>
      </section>

      <section class="auth-panel hidden" id="registerPanel" aria-label="Registro BottleBloom">
        <button class="auth-back" type="button" data-auth-back>‹ Volver</button>
        <form class="auth-card" id="registerForm" novalidate>
          <img class="panel-logo" src="assets/LOGOTIPO%20FONDO%20NEGRO.png" alt="BottleBloom" />
          <h2>Crear cuenta</h2>
          <p>Registra tu perfil para entrar a BottleBloom.</p>
          <div class="form-grid">
            <div class="field"><label>Nombre completo</label><input name="fullName" autocomplete="name" required /><small></small></div>
            <div class="field"><label>Correo</label><input name="email" type="email" autocomplete="email" required /><small></small></div>
            <div class="field"><label>Contraseña</label><input name="password" type="password" autocomplete="new-password" required minlength="6" /><small></small></div>
            <div class="field"><label>Rol</label><select name="role" required><option value="">Selecciona un rol</option><option>Estudiante</option><option>Docente</option><option>Bar</option><option>Admin</option></select><small></small></div>
            <button class="auth-action primary form-submit" id="createAccountBtn" type="submit">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21a6 6 0 0 0-12 0"/><circle cx="10" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>
              <span>Crear cuenta</span>
            </button>
          </div>
        </form>
      </section>
    </section>
  </main>

  <script type="module">
    import { setUid, saveUserProfile, getUserProfile } from './js/firebase.js';

    const profileStorageKey = 'bb_profile_module';
    const panels = {
      login: document.querySelector('#loginPanel'),
      register: document.querySelector('#registerPanel')
    };
    const choice = document.querySelector('#authChoice');

    const openProfile = () => {
      if (window.top && window.top !== window.self) window.top.location.href = 'profile.html';
      else location.href = 'profile.html';
    };

    const validEmail = (email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    const setInvalid = (input, invalid, message = '') => {
      const field = input.closest('.field');
      field.classList.toggle('invalid', invalid);
      field.querySelector('small').textContent = invalid ? message : '';
    };

    document.querySelectorAll('[data-open-auth]').forEach(button => {
      button.addEventListener('click', () => {
        choice.classList.add('hidden');
        Object.values(panels).forEach(panel => panel.classList.add('hidden'));
        panels[button.dataset.openAuth].classList.remove('hidden');
      });
    });

    document.querySelectorAll('[data-auth-back]').forEach(button => {
      button.addEventListener('click', () => {
        Object.values(panels).forEach(panel => panel.classList.add('hidden'));
        choice.classList.remove('hidden');
      });
    });

    document.querySelector('#registerForm')?.addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const fullName = form.fullName.value.trim();
      const email = form.email.value.trim();
      const password = form.password.value.trim();
      const role = form.role.value;
      let ok = true;

      setInvalid(form.fullName, fullName.length < 3, 'Escribe tu nombre completo.');
      setInvalid(form.email, !validEmail(email), 'Ingresa un correo válido.');
      setInvalid(form.password, password.length < 6, 'Mínimo 6 caracteres.');
      setInvalid(form.role, !role, 'Selecciona un rol.');
      ok = fullName.length >= 3 && validEmail(email) && password.length >= 6 && !!role;
      if (!ok) return;

      const uid = crypto.randomUUID();
      setUid(uid);
      const profile = {
        uid,
        name: fullName,
        fullName,
        email,
        role,
        memberType: role,
        institution: 'Unidad Educativa Eight Academy',
        photo: 'assets/MASCOTA%20PLANTA.png',
        avatar: 'assets/MASCOTA%20PLANTA.png',
        coins: 0,
        xp: 0,
        level: 'Nivel 1',
        currentStreak: 1,
        maxStreak: 1,
        createdAt: new Date().toISOString()
      };
      await saveUserProfile(profile);
      localStorage.setItem(profileStorageKey, JSON.stringify({
        fullName,
        ecoName: 'EcoGuardián',
        phrase: 'Estudiante comprometido con el planeta.',
        email,
        role,
        memberType: role,
        institution: profile.institution,
        level: 'Nivel 1',
        rank: 'EcoGuardián',
        xp: 0,
        neededXp: 1000,
        coins: 0,
        nfts: 0,
        avatar: profile.avatar
      }));
      openProfile();
    });

    document.querySelector('#loginForm')?.addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const email = form.email.value.trim();
      const password = form.password.value.trim();
      setInvalid(form.email, !validEmail(email), 'Ingresa un correo válido.');
      setInvalid(form.password, password.length < 6, 'Mínimo 6 caracteres.');
      if (!validEmail(email) || password.length < 6) return;

      const current = await getUserProfile();
      const uid = current.uid && current.uid !== 'demo-user' ? current.uid : crypto.randomUUID();
      setUid(uid);
      await saveUserProfile({
        ...current,
        uid,
        email,
        name: current.name || 'Eco Guerrero',
        photo: current.photo || 'assets/MASCOTA%20PLANTA.png',
        level: current.level || 'Nivel 1',
        coins: Number(current.coins || 0),
        xp: Number(current.xp || 0)
      });
      openProfile();
    });
  </script>
</body>
</html>
