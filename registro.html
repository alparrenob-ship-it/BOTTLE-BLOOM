<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BottleBloom | Registro</title>
  <link rel="stylesheet" href="css/bottlebloom-app.css">
  <link rel="stylesheet" href="css/registro.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="side-top">
        <a class="logo-lockup" href="home.html">
          <img src="assets/LOGOTIPO%20FONDO%20NEGRO.png" alt="BottleBloom">
          <span class="brand-copy brand-name">Bottle<span>Bloom</span></span>
        </a>
        <button class="collapse-btn">BB</button>
      </div>
      <nav class="side-nav">
        <a href="home.html"><span class="nav-icon">H</span><span class="nav-label">Dashboard</span></a>
        <a href="profile.html"><span class="nav-icon">P</span><span class="nav-label">Perfil</span></a>
        <a href="registro.html"><span class="nav-icon">R</span><span class="nav-label">Registro</span></a>
        <a href="retos.html"><span class="nav-icon">D</span><span class="nav-label">Retos</span></a>
        <a href="eightcoins.html"><span class="nav-icon">8</span><span class="nav-label">Eight Coins</span></a>
        <a href="nfts.html"><span class="nav-icon">N</span><span class="nav-label">NFTs</span></a>
        <a href="impacto.html"><span class="nav-icon">I</span><span class="nav-label">Impacto</span></a>
      </nav>
    </aside>

    <main class="app-main registry-main">
      <header class="topbar registry-topbar">
        <div class="hello">
          <h1 id="helloName">Hola, Eco Guerrero</h1>
          <p>Historial de botellas registradas con ID unica</p>
        </div>
        <div class="top-actions">
          <span class="pill" id="topCoins"></span>
          <span class="pill" id="topLevel"></span>
          <img class="avatar" id="topAvatar" alt="Perfil">
        </div>
      </header>

      <section class="registry-phone" aria-label="Mis botellas registradas">
        <div class="registry-mobile-head">
          <a class="registry-back" href="home.html" aria-label="Volver al dashboard">‹</a>
          <h2>Mis botellas</h2>
          <a class="registry-new" href="scan.html" aria-label="Registrar nueva botella">+</a>
        </div>

        <div class="bottle-tabs" role="tablist" aria-label="Filtros de botellas">
          <button class="bottle-tab active" type="button" data-filter="all">Todas</button>
          <button class="bottle-tab" type="button" data-filter="biofertilizante">Biofertilizantes</button>
          <button class="bottle-tab" type="button" data-filter="reutilizacion">Reutilización</button>
        </div>

        <div class="bottle-history-list" id="bottleList"></div>
      </section>
    </main>
  </div>

  <div class="modal" id="detailModal">
    <div class="glass-card modal-card" id="detailContent"></div>
  </div>

  <script type="module" src="js/bottlebloom-app.js"></script>
</body>
</html>
